// Colour palette - one colour per route (numeric routes use fixed palette, letter routes too)
const numericRoutes=[1,2,3,5,6,8,9,10,12,15,17,18,19,20,21,22,23];
const letterRoutes=['A','B','C','D','E','F','G','H','I'];
const palette=['#377eb8','#4daf4a','#984ea3','#ff7f00','#a65628','#f781bf','#999999',
               '#66c2a5','#fc8d62','#8da0cb','#e78ac3','#a6d854','#ffd92f','#e5c494',
               '#b3b3b3','#1b9e77','#d95f02','#7570b3','#e7298a','#66a61e',
               '#e6ab02','#a6761d','#2166ac','#5aae61','#762a83'];

const routeColors={};
numericRoutes.forEach((r,i)=>routeColors[String(r)]=palette[i%palette.length]);
letterRoutes.forEach((r,i)=>routeColors[r]=palette[(numericRoutes.length+i)%palette.length]);

const SELECTED_COLOR='#e41a1c';
const DEFAULT_WEIGHT=6;
const DEFAULT_OPACITY=0.45;
const SELECTED_WEIGHT=6;
const SELECTED_OPACITY=0.9;

const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors'
}).addTo(map);

// Build groups
const groups={};
const groupBounds={};
const groupInfo={};

roads.forEach(r=>{
  const key=String(r.route);
  if(!groups[key]) { groups[key]=L.layerGroup(); groupBounds[key]=[]; }
  r.segments.forEach(seg=>{
    const poly=L.polyline(seg,{
      color:routeColors[key]||'#888',
      weight:DEFAULT_WEIGHT,
      opacity:DEFAULT_OPACITY
    }).bindPopup('<b>'+r.street+'</b><br>Route '+r.route+'<br>'+r.res+' residences');
    groups[key].addLayer(poly);
    seg.forEach(pt=>groupBounds[key].push(pt));
  });
  if(!groupInfo[key]) groupInfo[key]={res:0,streets:[]};
  groupInfo[key].res+=r.res;
  groupInfo[key].streets.push(r.street);
});

// Sort routes: numeric first then letters
const allRoutes=Object.keys(groups).sort((a,b)=>{
  const aNum=!isNaN(a), bNum=!isNaN(b);
  if(aNum&&bNum) return Number(a)-Number(b);
  if(aNum) return -1;
  if(bNum) return 1;
  return a.localeCompare(b);
});

const sel=document.getElementById('sel');
const info=document.getElementById('info');
allRoutes.forEach(g=>{
  const o=document.createElement('option');
  o.value=g;
  const isLetter=isNaN(g);
  o.textContent=(isLetter?'Group ':'Route ')+g+' ('+groupInfo[g].res+' res)';
  sel.appendChild(o);
});

let currentSelection='all';

function resetAllStyles(){
  allRoutes.forEach(key=>{
    groups[key].eachLayer(layer=>{
      if(layer.setStyle){
        layer.setStyle({color:routeColors[key]||'#888',weight:DEFAULT_WEIGHT,opacity:DEFAULT_OPACITY});
      }
    });
  });
}

function show(g){
  Object.values(groups).forEach(l=>map.removeLayer(l));
  resetAllStyles();
  currentSelection=g;
  info.textContent='';
  
  if(g==='all'){
    allRoutes.forEach(key=>groups[key].addTo(map));
    if(Object.keys(groupBounds).length){
      const allBounds=[].concat(...Object.values(groupBounds));
      if(allBounds.length) map.fitBounds(allBounds);
    }
  } else {
    // Show all routes but highlight selected in red
    allRoutes.forEach(key=>groups[key].addTo(map));
    // Highlight selected
    groups[g].eachLayer(layer=>{
      if(layer.setStyle){
        layer.setStyle({color:SELECTED_COLOR,weight:SELECTED_WEIGHT,opacity:SELECTED_OPACITY});
        layer.bringToFront();
      }
    });
    // Zoom to selected group
    if(groupBounds[g]&&groupBounds[g].length){
      map.fitBounds(groupBounds[g],{padding:[30,30]});
    }
    const isLetter=isNaN(g);
    info.textContent=(isLetter?'Group ':'Route ')+g+': '+groupInfo[g].res+' residences';
  }
}

sel.onchange=e=>show(e.target.value);
show('all');
</script></body></html>
